name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger VPS Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "===> Checking Current User & Directory <==="
            whoami
            pwd

            echo "===> Loading Node & Path <==="
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            which node || true
            which npm || true

            echo "===> Navigating to Project <==="
            if [ -d "/var/www/globetrek" ]; then
              cd /var/www/globetrek
            elif [ -d "$HOME/globetrek" ]; then
              cd "$HOME/globetrek"
            else
              echo "Project directory not found!"
              exit 1
            fi
            pwd

            echo "===> Pulling latest changes <==="
            git pull origin main

            echo "===> Building Application <==="
            npm install --production=false
            npm run build

            echo "===> Restarting App <==="
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart globetrek || pm2 start .output/server/index.mjs --name "globetrek"
            else
              echo "PM2 not found in PATH, skipping PM2 restart"
            fi



