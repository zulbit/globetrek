name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger VPS Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "===> Navigating to App Directory <==="
            cd /var/www/tour_testben_usr89/data/www/tour.testbench.shop/app || cd /home/ubuntu/app
            pwd

            echo "===> Pulling latest changes <==="
            git reset --hard
            git pull origin main

            echo "===> Installing & Building <==="
            npm install --production=false
            npm run build

            echo "===> Syncing Static Assets to Nginx Web Root <==="
            sudo cp -r .output/public/* /var/www/tour_testben_usr89/data/www/tour.testbench.shop/
            for f in /var/www/tour_testben_usr89/data/www/tour.testbench.shop/assets/styles-*.css; do
              sudo cp "$f" /var/www/tour_testben_usr89/data/www/tour.testbench.shop/assets/styles-Df1OHlXA.css 2>/dev/null || true
              sudo cp "$f" /var/www/tour_testben_usr89/data/www/tour.testbench.shop/styles.css 2>/dev/null || true
            done
            sudo chown -R tour_testben_usr89:tour_testben_usr89 /var/www/tour_testben_usr89/data/www/tour.testbench.shop/assets /var/www/tour_testben_usr89/data/www/tour.testbench.shop/styles.css

            echo "===> Restarting Server with PM2 <==="
            PORT=4005 pm2 restart globetrek --update-env || pm2 restart globetrek-tour --update-env || pm2 start .output/server/index.mjs --name "globetrek"
            pm2 save




